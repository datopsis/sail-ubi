name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install hash-pinned CI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-dnf
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.txt
      - name: Lint and security regression tests
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Shell syntax
        run: bash -n scripts/*.sh
  image:
    name: image (${{ matrix.arch }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      ARCHITECTURE: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      CONTAINER_RUNTIME: docker
      IMAGE: localhost/sail-ubi:test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Confirm native architecture
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Install host verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm gnupg python3-dnf
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.txt
          python -m pip install --require-hashes --no-build-isolation -r .github/requirements/client.txt
      - name: Verify upstream and RPM publishers
        run: |
          python scripts/fetch.py --arch "$ARCHITECTURE"
          python tests/acquisition.py "$ARCHITECTURE"
      - name: Build offline from verified inputs
        id: build
        run: |
          bash scripts/build.sh
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE")" = "$ARCHITECTURE"
      - name: Restricted runtime and real Spark Connect requests
        run: python tests/runtime.py
      - name: Build approved pinned NGINX TLS proxy
        id: proxy
        env:
          NGINX_SOURCE: ${{ runner.temp }}/sail-nginx
        run: bash scripts/build-tls-proxy.sh
      - name: Qualify shipped Sail TLS paths and certificate negatives
        env:
          NGINX_SOURCE: ${{ runner.temp }}/sail-nginx
        run: python tests/tls.py
      - name: Diagnose stream reset without changing the qualification gate
        if: ${{ !cancelled() && steps.proxy.outcome == 'success' }}
        env:
          NGINX_SOURCE: ${{ runner.temp }}/sail-nginx
        run: python tests/stream_diagnostics.py
      - name: Install pinned scanners
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/install-tools.py
      - name: SBOM and blocking Trivy and Grype scans
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/scan.sh
      - name: Retain complete evidence including unfixed vulnerabilities
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.arch }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
  tracking:
    name: Track UBI fix availability
    needs: [lint, image]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ubi-fix-tracking
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: scan-evidence
      - name: Update one tracking issue and notify on state changes
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_RESULTS: '{"lint":"${{ needs.lint.result }}","image":"${{ needs.image.result }}"}'
        run: python3 scripts/track-vulnerabilities.py scan-evidence
