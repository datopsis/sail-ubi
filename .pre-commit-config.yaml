repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: invariants
        name: Lock and workflow invariants
        entry: python scripts/lint.py
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Security boundary regression tests
        entry: python -m unittest discover -s tests -p test_*.py
        language: system
        pass_filenames: false
      - id: lf-line-endings
        name: Reject CRLF line endings
        language: system
        entry: bash -c 'if git ls-files --eol | grep -E "^i/(crlf|mixed)"; then echo "CRLF line endings found, commit LF only (see .gitattributes)" >&2; exit 1; fi'
        pass_filenames: false
        always_run: true
